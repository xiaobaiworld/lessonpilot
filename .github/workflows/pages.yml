name: pages

# Publish the teacher-facing pages to GitHub Pages (D-010).
#
# The publish set is an explicit allowlist, not the repository with exclusions. The
# repository holds competitor pricing research, sales scripts and commercialisation
# plans under doc/. With an exclude list, adding a file to doc/ later would leak it
# by default; with an allowlist, a new file is private until someone deliberately
# adds it here.
#
# Adding a path below makes it publicly fetchable and indexable, and that is not
# reversible once crawled. Treat edits to the copy steps as a security change.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; never cancel a run mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install locked v1 environment
        run: npm ci --prefix v1

      # npm test 的端点一致性检查会通过 uv 启动 v1 FastAPI。
      - name: Install locked backend tooling
        run: python -m pip install uv==0.11.12

      # npm test 覆盖 .test.js 与 .test.mjs 两类；单个 glob 会静默漏掉后者。
      - name: Run tests
        run: npm test

      - name: Stage the publish set
        run: |
          set -euo pipefail
          mkdir -p site/assets
          cp v1/site/index.html site/index.html
          cp v1/site/student-guide.html site/student-guide.html
          cp v1/site/subtitle-context.js site/subtitle-context.js
          cp v1/site/demo-captions.js site/demo-captions.js
          cp v1/site/trial-intake.js site/trial-intake.js
          cp v1/site/link.html site/link.html
          cp -R v1/site/assets/. site/assets/

          # Jekyll would otherwise skip files it considers special.
          touch site/.nojekyll

      - name: Verify nothing private was staged
        run: |
          set -euo pipefail
          # A copy step added carelessly is the realistic failure mode here, so fail
          # the build rather than trust review to catch it.
          if find site -type d \( -name doc -o -name src -o -name tests \) | grep -q .; then
            echo "refusing to publish: private directory staged"
            exit 1
          fi
          if find site -name '*.md' | grep -q .; then
            echo "refusing to publish: markdown staged"
            exit 1
          fi
          echo "publish set:"
          find site -type f | sort

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
