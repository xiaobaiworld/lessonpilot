name: pages

# Publish the teacher-facing pages to GitHub Pages (D-010).
#
# The publish set is an explicit allowlist, not the repository with exclusions. The
# repository holds competitor pricing research, sales scripts and commercialisation
# plans under doc/. With an exclude list, adding a file to doc/ later would leak it
# by default; with an allowlist, a new file is private until someone deliberately
# adds it here.
#
# Adding a path below makes it publicly fetchable and indexable, and that is not
# reversible once crawled. Treat edits to the copy steps as a security change.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; never cancel a run mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # Never publish a build whose contract fails its own tests.
      - name: Assemble shared contract
        run: node tools/assemble-workspace.js

      - name: Install dependencies
        run: npm ci

      - name: Install locked v1 environment
        run: npm ci --prefix v1

      # npm test 覆盖 .test.js 与 .test.mjs 两类；单个 glob 会静默漏掉后者。
      - name: Run tests
        run: npm test

      - name: Stage the publish set
        run: |
          set -euo pipefail
          mkdir -p site/teacher-web/shared

          # The sales page teachers are meant to read. Self-contained single file
          # plus the two scripts it loads; nothing here reads doc/, src/ or tests/.
          cp teacher-web/forsales.html             site/teacher-web/
          cp teacher-web/subtitle-context.js       site/teacher-web/
          cp teacher-web/demo-captions.js          site/teacher-web/
          cp teacher-web/trial-intake.js            site/teacher-web/
          mkdir -p site/teacher-web/assets
          cp teacher-web/assets/knownmap-icon.png  site/teacher-web/assets/

          # The 1A diagnostics page and its page-side scripts.
          cp teacher-web/workspace.html            site/teacher-web/
          cp teacher-web/workspace-bridge-client.js site/teacher-web/
          cp teacher-web/workspace-diagnostics.js   site/teacher-web/

          # The frozen workspace contract files committed under teacher-web/shared/.
          cp teacher-web/shared/bridge-protocol.js  site/teacher-web/shared/
          cp teacher-web/shared/course-contract.js  site/teacher-web/shared/

          # Jekyll would otherwise skip files it considers special.
          touch site/.nojekyll

      - name: Verify nothing private was staged
        run: |
          set -euo pipefail
          # A copy step added carelessly is the realistic failure mode here, so fail
          # the build rather than trust review to catch it.
          if find site -type d \( -name doc -o -name src -o -name tests \) | grep -q .; then
            echo "refusing to publish: private directory staged"
            exit 1
          fi
          if find site -name '*.md' | grep -q .; then
            echo "refusing to publish: markdown staged"
            exit 1
          fi
          echo "publish set:"
          find site -type f | sort

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
