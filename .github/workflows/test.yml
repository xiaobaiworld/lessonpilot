name: test

# Stage 1A onwards this is the PR gate. The suite is zero-dependency Node, so it
# needs no install step and runs in seconds.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # The workspace page loads the shared contract from teacher-web/shared/, which
      # is assembled rather than committed (D-010). Some tests assert the assembler
      # and the page agree on that file list, so build it before running them.
      - name: Assemble shared contract
        run: node tools/assemble-workspace.js

      - name: Run tests
        run: node --test tests/*.test.js

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install locked backend environment
        working-directory: backend
        run: |
          python -m pip install uv==0.11.12
          uv sync --frozen --all-groups

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest
