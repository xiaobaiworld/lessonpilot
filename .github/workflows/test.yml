name: test

# Current v1 pull-request gate.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # The remaining static workspace still consumes its committed bridge files.
      - name: Assemble shared contract
        run: node tools/assemble-workspace.js

      # 契约校验依赖（ajv）从仓库内解析，不能依赖开发机全局 node_modules。
      - name: Install dependencies
        run: npm ci

      - name: Install locked v1 environment
        run: npm ci --prefix v1

      # 用 npm test 而不是直接写 glob：测试同时有 .test.js（CommonJS）和
      # .test.mjs（ESM，文档一致性检查需要 import 工具模块），并通过根入口覆盖
      # v1 Vitest；单个 glob 会静默漏掉一类。
      - name: Run tests
        run: npm test

      - name: Check and build v1 applications
        run: |
          npm --prefix v1 run lint
          npm --prefix v1 run type-check
          npm --prefix v1 run build

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install locked backend environment
        working-directory: v1/backend
        run: |
          python -m pip install uv==0.11.12
          uv sync --frozen --all-groups

      # 静态检查在测试之前：lint 错误比测试失败更快定位，且 0F 要求零错误。
      - name: Lint backend
        working-directory: v1/backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run backend tests
        working-directory: v1/backend
        run: uv run pytest

  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install locked Node environment
        run: npm ci

      - name: Check v1 contracts
        run: npm run check:contract

      - name: Check documents, endpoints and module boundaries
        run: |
          node tools/doc-check.mjs
          node tools/endpoint-check.mjs
          node tools/v1-module-check.mjs
          node tools/build-traceability.mjs --check

      # SEC-SECRET-003 把仓库秘密扫描列为验收证据。
      - name: Scan for secrets
        run: node tools/secret-scan.mjs

      # DEV-DEP-001 的离线部分：锁文件存在且同步、版本已约束、依赖数量可审阅。
      - name: Check dependency locking
        run: node tools/dependency-check.mjs

      # 漏洞库查询需要联网，只能在 CI 做。开发机常用镜像源不实现 advisories 端点，
      # 在本机跑 npm audit 得到的是 404 而不是「无漏洞」—— 那是最坏的假绿。
      - name: Audit Node dependencies
        run: npm audit --audit-level=high

      # --skip-editable 跳过本项目自身：它不在 PyPI 上，没有可查的公告。
      # 不用 --strict：它会把这个必然的跳过当成失败。
      - name: Audit Python dependencies
        working-directory: v1/backend
        run: uv run --with pip-audit pip-audit --skip-editable
