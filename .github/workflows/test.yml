name: test

# Stage 1A onwards this is the PR gate. The suite is zero-dependency Node, so it
# needs no install step and runs in seconds.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # The workspace page loads the shared contract from teacher-web/shared/, which
      # is assembled rather than committed (D-010). Some tests assert the assembler
      # and the page agree on that file list, so build it before running them.
      - name: Assemble shared contract
        run: node tools/assemble-workspace.js

      # 契约校验依赖（ajv）从仓库内解析，不能依赖开发机全局 node_modules。
      - name: Install dependencies
        run: npm ci

      # 用 npm test 而不是直接写 glob：测试同时有 .test.js（CommonJS）和
      # .test.mjs（ESM，文档一致性检查需要 import 工具模块），单个 glob 会静默漏掉一类。
      - name: Run tests
        run: npm test

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install locked backend environment
        working-directory: backend
        run: |
          python -m pip install uv==0.11.12
          uv sync --frozen --all-groups

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest
