<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LessonPilot 互动课程">
    <title>LessonPilot · 互动课程</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="LessonPilot 课程首页">
          <span class="brand-mark">LP</span>
          <span><strong>LessonPilot</strong><small>互动课程</small></span>
        </a>
        <span class="session-pill">课程预览</span>
      </header>

      <main class="lesson-layout">
        <section class="course-intro" aria-labelledby="lesson-title">
          <p class="eyebrow">本节学习</p>
          <h1 id="lesson-title">加载课程中</h1>
          <p class="lead" id="lesson-summary">准备学习内容。</p>
          <div class="learning-goals" aria-labelledby="learning-goals-title">
            <span id="learning-goals-title">学习目标</span>
            <div id="learning-goals-list" class="goal-list"></div>
          </div>
        </section>

        <section class="video-panel" aria-label="课程视频">
          <iframe id="bilibili-player" class="lesson-video" title="课程视频" allowfullscreen></iframe>
          <div class="video-meta"><span>课程视频</span><a id="bilibili-page-link" href="https://www.bilibili.com/video/BV1WW4y1e7GL/" target="_blank" rel="noreferrer">在 B 站打开原课 ↗</a></div>
        </section>

        <section class="learning-results" aria-labelledby="learning-results-title">
          <div class="results-heading"><p class="eyebrow">完成本节后</p><h2 id="learning-results-title">学习结果展示</h2><p>以下是本节课设计的学习产出。完成记录会在互动学习路径接入后显示。</p></div>
          <div id="expected-results-list" class="result-list"></div>
        </section>

        <section id="load-error" class="load-error" hidden aria-live="polite">
          <p class="eyebrow">课程未启动</p>
          <h2>暂时无法读取这节课。</h2>
          <p id="load-error-copy"></p>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
