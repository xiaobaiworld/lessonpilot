<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KnownMap · 学习伙伴设置</title>
    <link rel="stylesheet" href="../assets/tokens.css" />
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main class="settings-shell">
      <header class="topbar">
        <div class="brand">
          <img src="../assets/icon-48.png" alt="" />
          <div><strong>KnownMap</strong><small>学习伙伴 · <span id="version">v—</span></small></div>
        </div>
        <div class="topbar-actions">
          <button id="back-button" class="back-button" type="button">‹ 返回插件</button>
          <button id="close-button" class="close-button" type="button" aria-label="关闭设置页">×</button>
        </div>
      </header>

      <section class="content" aria-labelledby="page-title">
        <p class="eyebrow">LEARNING COMPANION</p>
        <h1 id="page-title">选择你的学习伙伴</h1>
        <p class="subtitle">选择一个伙伴，它会带着自己的状态图和声音，在学习的合适时刻陪着你。</p>

        <section class="selected-card" aria-labelledby="selected-title">
          <img id="selected-avatar" class="selected-avatar" alt="当前学习伙伴" />
          <div class="selected-copy">
            <h2 id="selected-title">神秘猫精灵</h2>
            <p>能够给你温柔陪伴，并带来特殊力量，让你的学习效率倍增。</p>
          </div>
          <span class="selected-badge">已选择</span>
        </section>

        <section class="section" aria-labelledby="state-title">
          <h2 id="state-title">它在学习中的样子</h2>
          <div class="state-strip" aria-label="神秘猫精灵状态预览">
            <button type="button" class="state-thumb" data-state-preview="idle" aria-label="安静等待"><img alt="安静等待" /></button>
            <button type="button" class="state-thumb" data-state-preview="focus" aria-label="开始注意"><img alt="开始注意" /></button>
            <button type="button" class="state-thumb" data-state-preview="prompt" aria-label="提示与等待"><img alt="提示与等待" /></button>
            <button type="button" class="state-thumb" data-state-preview="correct" aria-label="答对反馈"><img alt="答对反馈" /></button>
            <button type="button" class="state-thumb" data-state-preview="wrong" aria-label="答错反馈"><img alt="答错反馈" /></button>
            <button type="button" class="state-thumb" data-state-preview="complete" aria-label="完成庆祝"><img alt="完成庆祝" /></button>
          </div>
        </section>

        <section class="section" aria-labelledby="sound-title">
          <h2 id="sound-title">神秘猫精灵声音组</h2>
          <div class="sound-list">
            <div class="sound-row"><span><strong>开始注意</strong><small>0.6 秒 · 角色专属声音</small></span><button type="button" data-audio-preview="focus">试听</button></div>
            <div class="sound-row"><span><strong>提示与等待</strong><small>1.1 秒 · 角色专属声音</small></span><button type="button" data-audio-preview="prompt">试听</button></div>
            <div class="sound-row"><span><strong>答对反馈</strong><small>0.6 秒 · 角色专属声音</small></span><button type="button" data-audio-preview="correct">试听</button></div>
            <div class="sound-row"><span><strong>答错反馈</strong><small>1.1 秒 · 角色专属声音</small></span><button type="button" data-audio-preview="wrong">试听</button></div>
            <div class="sound-row"><span><strong>完成庆祝</strong><small>3 秒 · 角色专属声音</small></span><button type="button" data-audio-preview="complete">试听</button></div>
          </div>
          <button id="sound-switch" class="sound-switch" type="button">学习时播放声音</button>
        </section>

        <section class="section" aria-labelledby="category-title">
          <h2 id="category-title">选择伙伴类别</h2>
          <div class="categories" aria-label="角色类别">
            <button class="category active" type="button" data-pack-id="cat-v1" aria-pressed="true">
              <img id="category-avatar" alt="" />
              <strong>神秘猫精灵</strong><small>温柔陪伴 · 特殊力量</small>
              <span>用安静又有力量的陪伴，帮你把每一次专注变得更有收获。</span><i>✓</i>
            </button>
            <button class="category disabled" type="button" disabled><b>🐶</b><strong>元气伙伴</strong><small>热情鼓励 · 持续动力</small><span>用满满的热情陪你坚持，让每一次尝试都更有动力。</span><em>下一版本完成</em></button>
            <button class="category disabled" type="button" disabled><b>🦊</b><strong>森林伙伴</strong><small>轻松陪伴 · 保持好奇</small><span>带来轻松新鲜的陪伴，帮助你保持好奇与专注。</span><em>下一版本完成</em></button>
            <button class="category disabled" type="button" disabled><b>🧑‍🚀</b><strong>未知世界伙伴</strong><small>空灵相遇 · 专属陪伴</small><span>来自未知世界的特别伙伴，更多能力正在准备中。</span><em>下一版本完成</em></button>
          </div>
        </section>

        <p class="tip">选对伙伴，让你的学习事半功倍。</p>
        <p class="return-note">关闭后请从浏览器工具栏重新打开 KnownMap 插件。</p>
        <p class="error" id="error" hidden></p>
      </section>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
