<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frameflow · AI 视频工作流原型</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#201d19;background:#f6f3ed;font-synthesis:none}
    *{box-sizing:border-box} body{margin:0} button,input,textarea{font:inherit} button{cursor:pointer} button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #e8a649;outline-offset:2px}
    .app{min-height:100vh;display:grid;grid-template-columns:238px minmax(370px,1fr) minmax(350px,465px)}
    .sidebar{background:#242620;color:#f8f5ec;padding:30px 18px;display:flex;flex-direction:column;gap:38px}
    .brand{display:flex;align-items:center;gap:11px;padding:0 11px}.brand-mark{display:grid;place-items:center;width:37px;height:37px;border-radius:11px;background:#f1b35f;color:#25231d;font-size:20px;font-weight:900}.brand strong{display:block;font-size:18px;letter-spacing:-.05em}.brand small{display:block;color:#a9aea1;font-size:10px;letter-spacing:.14em;margin-top:1px}
    .side-label{font-size:10px;letter-spacing:.2em;color:#a3a99c;padding:0 12px;margin-bottom:12px}.steps{display:grid;gap:5px}.step{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:12px;background:none;color:#afb6a8;padding:12px}.step:hover{background:#30342d;color:#fff}.step.active{background:#40483b;color:#fff}.step.done .step-number{color:#f3bf77;border-color:#98734a}.step-number{width:28px;height:28px;flex:none;display:grid;place-items:center;border:1px solid #5b6256;border-radius:9px;font-size:11px;font-weight:800}.step strong{font-size:13px;font-weight:650}.side-footer{margin-top:auto;padding:15px 12px;border-top:1px solid #43483f;color:#9ea79a;font-size:11px;line-height:1.7}.side-footer b{color:#f2bc72}
    main{padding:36px clamp(26px,4vw,64px) 60px;min-width:0}.topline{display:flex;align-items:center;justify-content:space-between;gap:20px}.eyebrow{color:#a26d34;font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase}.prototype-pill{border:1px solid #ded8cd;background:#fffaf0;color:#74664e;padding:7px 10px;border-radius:999px;font-size:11px}.hero{margin:32px 0 30px}.hero h1{font-size:clamp(31px,3vw,47px);letter-spacing:-.065em;line-height:1.08;margin:10px 0 13px;max-width:620px}.hero p{font-size:14px;color:#77766f;line-height:1.8;margin:0;max-width:580px}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid #dfdbd2;padding-bottom:16px;margin-bottom:23px}.section-head h2{font-size:21px;margin:0;letter-spacing:-.04em}.section-head span{font-size:12px;color:#8c8980}.field{display:grid;gap:9px;margin:0 0 21px}.field label,.field-title{font-size:12px;font-weight:800;color:#48453e}.field small{font-size:11px;color:#99958a}.text-input{width:100%;padding:14px 15px;border:1px solid #ddd8cd;border-radius:11px;background:#fffefa;color:#24221c;font-size:15px}.text-input::placeholder{color:#aaa69d}.chips,.options{display:flex;flex-wrap:wrap;gap:9px}.chip,.choice{border:1px solid #dedad0;background:#fffdfa;color:#5e5a50;border-radius:10px;padding:10px 13px;font-size:12px;font-weight:650;transition:.18s}.chip:hover,.choice:hover{border-color:#d59e56;transform:translateY(-1px)}.choice.selected{background:#2e3d30;color:#fff;border-color:#2e3d30}.choice small{display:block;opacity:.68;font-size:10px;font-weight:500;margin-top:4px}.option-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.option-grid .choice{text-align:left;min-height:80px;padding:15px}.option-grid .choice strong{display:block;font-size:14px}.option-grid .choice small{line-height:1.5}.hint{background:#eee8db;border-radius:12px;padding:14px 16px;color:#655c4c;font-size:12px;line-height:1.7;margin-top:21px}.hint b{color:#45392d}.stage-footer{display:flex;justify-content:space-between;gap:12px;margin-top:32px;border-top:1px solid #dfdbd2;padding-top:22px}.nav-button{border:1px solid #d9d4ca;background:#fffdfa;border-radius:10px;padding:12px 18px;color:#39382f;font-size:12px;font-weight:800}.nav-button.primary{background:#e5a75c;border-color:#e5a75c;color:#25231d}.nav-button:disabled{opacity:.4;cursor:default}
    .scene-list{display:grid;gap:10px}.scene-card{display:grid;grid-template-columns:48px 1fr;gap:14px;padding:15px;background:#fffdf9;border:1px solid #e4dfd5;border-radius:12px;text-align:left;width:100%;color:inherit}.scene-card:hover,.scene-card.selected{border-color:#d9a663;background:#fffaf1}.scene-index{display:grid;place-items:center;width:38px;height:38px;background:#f2ebdc;color:#9c6a32;border-radius:10px;font-size:12px;font-weight:800}.scene-card h3{font-size:14px;line-height:1.4;margin:0 0 5px}.scene-card p{font-size:11px;color:#79766f;margin:0;line-height:1.5}.scene-card small{display:block;color:#ac7841;margin-top:9px;font-size:10px;font-weight:700}.asset-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.asset{min-height:115px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;border:1px solid #dedad0;border-radius:12px;padding:12px;background:#fffdfa;color:#514f46;text-align:left}.asset.selected{border:2px solid #b67a39;background:#fff7e9}.asset-art{display:grid;place-items:center;width:100%;height:60px;border-radius:8px;background:#2b2b26;color:#e8ad5e;font-size:27px;font-weight:700}.asset strong{font-size:11px}.asset-note{font-size:11px;color:#8a867d;line-height:1.7;margin-top:12px}.checklist{display:grid;gap:9px}.check{display:flex;gap:11px;align-items:flex-start;background:#fffdf9;border:1px solid #e4dfd5;border-radius:10px;padding:13px 14px;font-size:12px;line-height:1.5;color:#4c4a43}.check input{accent-color:#3e5a42;margin-top:2px}.download{width:100%;margin-top:19px;border:0;border-radius:11px;padding:14px;background:#2f4736;color:white;font-weight:800}.download:hover{background:#213b29}
    .preview-pane{background:#eae6dd;border-left:1px solid #ddd7cb;padding:30px clamp(19px,2.6vw,36px);min-width:0;display:flex;flex-direction:column;gap:22px}.preview-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.preview-top strong{font-size:13px}.preview-top span{font-size:10px;color:#888275}.screen-shell{min-height:308px;display:grid;place-items:center;background:#dcd6cb;border-radius:17px;padding:18px;overflow:hidden}.screen{position:relative;width:100%;aspect-ratio:16/9;max-height:450px;overflow:hidden;background:#171815;color:#f8f2e5;box-shadow:0 20px 45px #2b241f3d;isolation:isolate}.screen.vertical{width:min(62%,245px);aspect-ratio:9/16}.screen[data-style="paper"]{background:#e9dfc7;color:#27342d}.screen[data-style="signal"]{background:#0a1921;color:#e5f5f5}.screen:before{content:"";position:absolute;inset:-25%;background:radial-gradient(circle at 70% 38%,#e9a85155,transparent 27%),radial-gradient(circle at 15% 80%,#cc7c3d22,transparent 33%);z-index:-1}.screen[data-style="paper"]:before{background:radial-gradient(circle at 50% 50%,#f7efda,transparent 48%)}.screen[data-style="signal"]:before{background:radial-gradient(circle at 70% 50%,#4aa4b055,transparent 31%)}.screen .grain{position:absolute;inset:0;opacity:.17;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E");pointer-events:none}.screen-top{position:absolute;left:6%;right:6%;top:8%;display:flex;justify-content:space-between;font-size:clamp(6px,.8vw,10px);font-weight:700;letter-spacing:.16em;opacity:.62}.screen-art{position:absolute;inset:12% 8% 24%;display:grid;place-items:center;opacity:.8}.screen-art svg{width:100%;height:100%;overflow:visible}.screen-art path,.screen-art line,.screen-art circle,.screen-art rect{stroke:var(--accent);fill:none;stroke-width:1.5}.screen-art .filled{fill:var(--accent);stroke:none}.screen[data-style="ember"]{--accent:#e5a650}.screen[data-style="paper"]{--accent:#a65d32}.screen[data-style="signal"]{--accent:#70c5cb}.screen-title{position:absolute;left:9%;right:9%;bottom:19%;font-size:clamp(17px,2vw,30px);font-weight:750;letter-spacing:-.05em;line-height:1.25;text-align:center;text-shadow:0 1px 20px #0005}.screen.vertical .screen-title{font-size:20px;bottom:25%}.screen-line{position:absolute;left:10%;right:10%;bottom:10%;font-size:clamp(7px,.88vw,11px);line-height:1.5;text-align:center;opacity:.7}.screen.vertical .screen-line{font-size:10px;bottom:16%}.screen.material-image .screen-art{opacity:.95}.screen.material-data .screen-art{opacity:1}.screen.playing .screen-art{animation:float 4s ease-in-out infinite alternate}.screen.playing .screen-title{animation:reveal .7s ease both}@keyframes float{to{transform:translateY(-9px) scale(1.03)}}@keyframes reveal{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
    .transport{background:#f8f6f0;border:1px solid #dcd6ca;border-radius:12px;padding:13px}.transport-row{display:flex;align-items:center;gap:11px}.play{width:34px;height:34px;flex:none;border:0;border-radius:50%;background:#253f30;color:#fff}.time{font-size:10px;color:#737066;white-space:nowrap;font-variant-numeric:tabular-nums}.progress{height:5px;flex:1;accent-color:#bc8242;cursor:pointer}.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.shot{border:0;background:#e9e4d9;border-radius:6px;height:26px;color:#797469;font-size:10px}.shot.active{background:#d8a86d;color:#2f2a22;font-weight:800}.summary{border:1px solid #dcd6ca;border-radius:14px;padding:18px;background:#f8f6f0}.summary-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.summary-head strong{font-size:13px}.summary-head small{font-size:10px;color:#9a8d79}.summary dl{display:grid;grid-template-columns:72px 1fr;gap:12px 9px;margin:0;font-size:11px}.summary dt{color:#938e83}.summary dd{margin:0;color:#3d3c36;font-weight:650;line-height:1.45}.disclaimer{font-size:10px;color:#898477;line-height:1.7;margin:0}
    .screen[data-pace="calm"].playing .screen-art{animation-duration:6s}.screen[data-pace="fast"].playing .screen-art{animation-duration:2s}.screen[data-transition="fade"].playing .screen-title{animation-name:fadeIn}.screen[data-transition="cut"].playing .screen-title{animation:none}.screen[data-pace="calm"].playing .screen-title{animation-duration:1.1s}.screen[data-pace="fast"].playing .screen-title{animation-duration:.3s}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @media(max-width:1120px){.app{grid-template-columns:185px minmax(330px,1fr)}.preview-pane{grid-column:2;grid-row:2;border-left:0;border-top:1px solid #ddd7cb}.sidebar{grid-row:1/3}.screen-shell{min-height:260px}.screen{max-width:520px}}
    @media(max-width:680px){.app{display:block}.sidebar{padding:15px;gap:13px}.brand{padding:0}.side-label,.side-footer{display:none}.steps{display:flex;overflow:auto;gap:5px}.step{width:auto;white-space:nowrap;padding:8px}.step strong{font-size:11px}.step-number{width:24px;height:24px}main{padding:26px 19px 40px}.hero{margin:22px 0 27px}.hero h1{font-size:33px}.option-grid{grid-template-columns:1fr 1fr}.preview-pane{padding:25px 19px}.screen-shell{min-height:250px}.screen-title{font-size:20px}.screen-line{font-size:9px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="制作步骤">
      <div class="brand"><div class="brand-mark">▶</div><div><strong>Frameflow</strong><small>VIDEO WORKSPACE</small></div></div>
      <div><div class="side-label">制作流程 / 06 STEPS</div><nav class="steps" id="steps"></nav></div>
      <div class="side-footer"><b>交互原型</b><br>在一个页面里走通想法、分镜、视觉与预览。所有内容留在本机浏览器。</div>
    </aside>
    <main>
      <div class="topline"><span class="eyebrow">FROM IDEA TO FRAME</span><span class="prototype-pill">本地示意 · 无需登录</span></div>
      <header class="hero"><h1>让一个想法，<br>慢慢变成一支片。</h1><p>选一个方向，逐步搭出短片的故事、画面和节奏。右侧会随着你的选择同步变化。</p></header>
      <section aria-live="polite"><div class="section-head"><h2 id="stage-title"></h2><span id="stage-count"></span></div><div id="editor"></div></section>
      <div class="stage-footer"><button class="nav-button" id="back">← 上一步</button><button class="nav-button primary" id="next">下一步 →</button></div>
    </main>
    <aside class="preview-pane" aria-label="实时预览">
      <div class="preview-top"><strong>实时画面预览</strong><span>示意动画 / 非最终成片</span></div>
      <div class="screen-shell"><div id="screen" class="screen" data-style="ember"><div class="grain"></div><div class="screen-top"><span>FRAMEFLOW / STORY FILM</span><span id="frame-no">01 — 04</span></div><div class="screen-art" id="screen-art"></div><div class="screen-title" id="screen-title"></div><div class="screen-line" id="screen-line"></div></div></div>
      <div class="transport"><div class="transport-row"><button class="play" id="play" aria-label="播放预览">▶</button><span class="time" id="time">00:00 / 00:45</span><input class="progress" id="progress" type="range" min="0" max="1000" value="0" aria-label="预览进度"></div><div class="shots" id="shots"></div></div>
      <div class="summary"><div class="summary-head"><strong>当前制作方案</strong><small>LIVE BRIEF</small></div><dl id="summary"></dl></div>
      <p class="disclaimer">这是流程与画面方向原型。素材为页面内绘制的示意图；下载的是制作单，不是视频文件。</p>
    </aside>
  </div>
  <script>
    const stageNames = ['选题调研','脚本分镜','视觉设定','素材生成','动效合成','校对导出'];
    const angles = {contrast:['反直觉切入','从一个常见误解开始，再给出新的理解。'],story:['故事切入','用一个具体情境带观众进入主题。'],question:['问题切入','用一个问题贯穿整支短片。']};
    const styles = {ember:['暗色光影','深色背景 · 琥珀高光'],paper:['纸张编辑','暖白纸面 · 印刷质感'],signal:['数字信号','深蓝空间 · 青色线条']};
    const materials = {type:['文字与图形','最适合观点短片'],image:['概念画面','适合情绪与场景'],data:['数据卡片','适合事实与解释']};
    const paces = {calm:['舒缓','给文字更多停留时间'],steady:['均衡','适合大多数叙事'],fast:['紧凑','信息快速推进']};
    const transitions = {fade:'渐隐渐现',slide:'滑入推进',cut:'直接切换'};
    const state = {stage:0,visited:0,topic:'为什么人们总是高估短期变化？',claim:'真正重要的变化，往往需要更长时间才能看见。',angle:'contrast',duration:45,ratio:'16:9',style:'ember',material:'type',pace:'steady',transition:'fade',frame:0,progress:0,playing:false,checks:[false,false,false,false]};
    let timer = null, playStart = 0, lastPreviewFrame = -1;
    const $ = id => document.getElementById(id);
    const escapeHtml = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const optionButtons = (key,items,grid=false) => `<div class="${grid?'option-grid':'options'}">${items.map(([value,title,desc])=>`<button type="button" class="choice ${state[key]===value?'selected':''}" data-key="${key}" data-value="${value}" aria-pressed="${state[key]===value}"><strong>${title}</strong>${desc?`<small>${desc}</small>`:''}</button>`).join('')}</div>`;
    function scenes(){const t=state.topic.trim()||'一个值得讲的主题',c=state.claim.trim()||'先说清楚你想让观众带走什么。';return [
      {label:'开场',title:t,line:'先抛出一个让人愿意继续看的问题。',visual:'主题文字出现，建立情绪'},
      {label:'展开',title:state.angle==='contrast'?'我们习惯这样理解':state.angle==='story'?'从一个真实情境开始':'问题出在哪里？',line:angles[state.angle][1],visual:'画面元素逐个出现'},
      {label:'转折',title:state.angle==='contrast'?'但换个角度看':state.angle==='story'?'变化开始发生':'答案正在浮现',line:c,visual:'关键观点占据画面中心'},
      {label:'收束',title:'留给观众的一句话',line:c,visual:'主题与结论汇合，干净收尾'}
    ]}
    function sceneSeconds(i){return Math.round(state.duration*i/4)}
    function renderNav(){ $('steps').innerHTML=stageNames.map((name,i)=>`<button class="step ${i===state.stage?'active':''} ${i<state.visited?'done':''}" data-stage="${i}" ${i===state.stage?'aria-current="step"':''}><span class="step-number">${String(i+1).padStart(2,'0')}</span><strong>${name}</strong></button>`).join('')}
    function renderEditor(){
      $('stage-title').textContent=stageNames[state.stage]; $('stage-count').textContent=`${String(state.stage+1).padStart(2,'0')} / 06`;
      const e=$('editor');
      if(state.stage===0)e.innerHTML=`<div class="field"><label for="topic">这支片子讲什么？</label><input id="topic" class="text-input" maxlength="100" placeholder="输入一个主题或问题"><small>先写一句话即可，后面仍可修改。</small></div><div class="field"><span class="field-title">试试这些主题</span><div class="chips"><button class="chip" data-topic="为什么人们总是高估短期变化？">时间与变化</button><button class="chip" data-topic="一颗种子如何长成一片森林？">自然与成长</button><button class="chip" data-topic="城市为什么需要夜晚？">城市与生活</button></div></div><div class="field"><span class="field-title">选择叙事角度</span>${optionButtons('angle',Object.entries(angles).map(([k,v])=>[k,...v]),true)}</div><div class="field"><label for="claim">希望观众带走的观点</label><input id="claim" class="text-input" maxlength="150" placeholder="一句核心观点"></div><div class="hint"><b>这一环节的产物</b>：一个主题、一种讲述角度和一句核心观点。这里不联网检索；正式制作时再核对需要引用的事实。</div>`;
      if(state.stage===1)e.innerHTML=`<div class="field"><span class="field-title">片长</span>${optionButtons('duration',[[30,'30 秒','短促有力'],[45,'45 秒','叙事更完整'],[60,'60 秒','给解释更多空间']])}</div><div class="field"><span class="field-title">四段式分镜草案</span><div class="scene-list" id="scene-list"></div></div><div class="hint"><b>分镜提示</b>：点击一段，右侧切换到对应画面。旁白与画面还是草案，适合在真实制作前继续打磨。</div>`;
      if(state.stage===2)e.innerHTML=`<div class="field"><span class="field-title">视觉语言</span>${optionButtons('style',Object.entries(styles).map(([k,v])=>[k,...v]),true)}</div><div class="field"><span class="field-title">画面比例</span>${optionButtons('ratio',[['16:9','16:9 横屏','适合网页与长视频'],['9:16','9:16 竖屏','适合手机短视频']])}</div><div class="hint"><b>统一规则</b>：整支片沿用同一组颜色、字重、留白和图形语汇；右侧预览会立即反映选择。</div>`;
      if(state.stage===3)e.innerHTML=`<div class="field"><span class="field-title">选择画面素材形式</span><div class="asset-grid">${Object.entries(materials).map(([k,v],i)=>`<button class="asset ${state.material===k?'selected':''}" data-key="material" data-value="${k}" aria-pressed="${state.material===k}"><span class="asset-art">${['Aa','◈','▥'][i]}</span><strong>${v[0]}</strong></button>`).join('')}</div><p class="asset-note">${materials[state.material][1]}。这些是可交互的构图占位图，尚未调用 ImageGen；正式制作时可按分镜逐张生成、筛选和替换。</p></div><div class="hint"><b>素材清单</b>：开场主视觉、展开元素、转折重点、结尾定格。只为实际分镜制作需要的素材。</div>`;
      if(state.stage===4)e.innerHTML=`<div class="field"><span class="field-title">运动节奏</span>${optionButtons('pace',Object.entries(paces).map(([k,v])=>[k,...v]),true)}</div><div class="field"><span class="field-title">段落转场</span>${optionButtons('transition',Object.entries(transitions).map(([k,v])=>[k,v]))}</div><div class="hint"><b>试播</b>：点击右侧播放按钮查看四段画面如何推进。这里的播放是交互预演，还没有配音、配乐或真实渲染。</div>`;
      if(state.stage===5)e.innerHTML=`<div class="field"><span class="field-title">导出前核对</span><div class="checklist">${['主题和核心观点清楚','分镜里的事实与引用已核对','字幕、配音和画面时长已确认','比例与发布平台相符'].map((v,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${state.checks[i]?'checked':''}><span>${v}</span></label>`).join('')}</div></div><div class="hint"><b>当前可导出</b>：制作单 Markdown，包含你的选择和四段分镜。这个原型尚不能导出 MP4 或直接发布。</div><button class="download" id="download">↓ 下载制作单 .md</button>`;
      if(state.stage===0){$('topic').value=state.topic;$('claim').value=state.claim}
      if(state.stage===1)renderSceneList();
      $('back').disabled=state.stage===0;$('next').disabled=state.stage===5;$('next').textContent=state.stage===4?'进入校对 →':'下一步 →';
    }
    function renderSceneList(){const list=$('scene-list');if(!list)return;if(list.children.length===4){[...list.children].forEach((card,i)=>card.classList.toggle('selected',i===state.frame));return}list.innerHTML=scenes().map((s,i)=>`<button type="button" class="scene-card ${state.frame===i?'selected':''}" data-frame="${i}"><span class="scene-index">${String(i+1).padStart(2,'0')}</span><span><h3>${escapeHtml(s.title)}</h3><p>${escapeHtml(s.line)}</p><small>${String(sceneSeconds(i)).padStart(2,'0')}–${String(sceneSeconds(i+1)).padStart(2,'0')} 秒 · ${s.visual}</small></span></button>`).join('')}
    function artwork(){
      if(state.material==='type')return '<svg viewBox="0 0 300 140" aria-hidden="true"><circle cx="150" cy="70" r="38"/><circle cx="150" cy="70" r="54" opacity=".35"/><circle class="filled" cx="150" cy="70" r="5"/><line x1="22" y1="70" x2="95" y2="70" opacity=".4"/><line x1="205" y1="70" x2="278" y2="70" opacity=".4"/></svg>';
      if(state.material==='image')return '<svg viewBox="0 0 300 140" aria-hidden="true"><circle class="filled" cx="151" cy="62" r="35" opacity=".7"/><path d="M18 125 Q74 91 126 119 T280 106"/><path d="M23 132 Q90 101 154 128 T286 114" opacity=".5"/></svg>';
      return '<svg viewBox="0 0 300 140" aria-hidden="true"><rect x="38" y="72" width="32" height="48"/><rect x="92" y="49" width="32" height="71"/><rect x="146" y="60" width="32" height="60"/><rect x="200" y="24" width="32" height="96"/><path d="M32 72 L105 49 L160 60 L216 24"/><circle class="filled" cx="216" cy="24" r="4"/></svg>';
    }
    function renderPreview(){const s=scenes()[state.frame],screen=$('screen'),shots=$('shots');screen.dataset.style=state.style;screen.dataset.pace=state.pace;screen.dataset.transition=state.transition;screen.classList.toggle('vertical',state.ratio==='9:16');screen.classList.toggle('playing',state.playing);screen.classList.remove('material-type','material-image','material-data');screen.classList.add('material-'+state.material);$('screen-art').innerHTML=artwork();$('screen-title').textContent=s.title;$('screen-line').textContent=s.line;$('frame-no').textContent=`0${state.frame+1} — 04`;if(state.playing&&state.frame!==lastPreviewFrame){screen.classList.remove('playing');void screen.offsetWidth;screen.classList.add('playing')}lastPreviewFrame=state.frame;if(!shots.children.length)shots.innerHTML=scenes().map((x,i)=>`<button class="shot" data-frame="${i}" aria-label="查看${x.label}">${x.label}</button>`).join('');[...shots.children].forEach((shot,i)=>shot.classList.toggle('active',i===state.frame));$('play').textContent=state.playing?'Ⅱ':'▶';$('play').setAttribute('aria-label',state.playing?'暂停预览':'播放预览');$('progress').value=Math.round(state.progress*1000);const sec=Math.floor(state.progress*state.duration);$('time').textContent=`00:${String(sec).padStart(2,'0')} / ${state.duration>=60?'01:00':'00:'+String(state.duration).padStart(2,'0')}`}
    function renderSummary(){const rows=[['主题',state.topic.trim()||'未填写'],['核心观点',state.claim.trim()||'未填写'],['结构',`${state.duration} 秒 · 四段式`],['画面',`${styles[state.style][0]} · ${state.ratio}`],['素材',materials[state.material][0]],['动效',`${paces[state.pace][0]} · ${transitions[state.transition]}`]];$('summary').innerHTML=rows.map(([k,v])=>`<dt>${k}</dt><dd>${escapeHtml(v)}</dd>`).join('')}
    function render(){renderNav();renderEditor();renderPreview();renderSummary()}
    function stop(){clearInterval(timer);timer=null;state.playing=false;renderPreview()}
    function tick(){state.progress=Math.min(1,(Date.now()-playStart)/(state.duration*1000));state.frame=Math.min(3,Math.floor(state.progress*4));renderPreview();renderSceneList();if(state.progress>=1)stop()}
    function selectFrame(i){stop();state.frame=i;state.progress=i/4;renderPreview();renderSceneList()}
    function downloadBrief(){const lines=['# 视频制作单','',`主题：${state.topic.trim()||'未填写'}`,`核心观点：${state.claim.trim()||'未填写'}`,`叙事角度：${angles[state.angle][0]}`,`片长：${state.duration} 秒`,`比例：${state.ratio}`,`视觉：${styles[state.style][0]}`,`素材形式：${materials[state.material][0]}`,`节奏：${paces[state.pace][0]}`,`转场：${transitions[state.transition]}`,'','## 分镜',...scenes().flatMap((s,i)=>['',`### ${i+1}. ${s.label}（${sceneSeconds(i)}–${sceneSeconds(i+1)} 秒）`,`屏幕文字：${s.title}`,`叙事要点：${s.line}`,`画面：${s.visual}`]),'','## 发布前核对',...['主题和观点','事实与引用','字幕配音与时长','画面比例'].map((x,i)=>`- [${state.checks[i]?'x':' '}] ${x}`),'','此文件来自本地交互原型；素材、配音、视频渲染与发布尚需实际制作。'];const blob=new Blob([lines.join('\n')],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='视频制作单.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
    $('steps').addEventListener('click',e=>{const b=e.target.closest('[data-stage]');if(!b)return;stop();state.stage=Number(b.dataset.stage);state.visited=Math.max(state.visited,state.stage);render()});
    $('editor').addEventListener('click',e=>{const topic=e.target.closest('[data-topic]');if(topic){state.topic=topic.dataset.topic;render();return}const option=e.target.closest('[data-key]');if(option){const key=option.dataset.key;state[key]=key==='duration'?Number(option.dataset.value):option.dataset.value;render();return}const frame=e.target.closest('[data-frame]');if(frame){selectFrame(Number(frame.dataset.frame));return}if(e.target.closest('#download'))downloadBrief()});
    $('editor').addEventListener('input',e=>{if(e.target.id==='topic')state.topic=e.target.value;if(e.target.id==='claim')state.claim=e.target.value;renderPreview();renderSummary()});
    $('editor').addEventListener('change',e=>{if(e.target.matches('[data-check]'))state.checks[Number(e.target.dataset.check)]=e.target.checked});
    $('back').addEventListener('click',()=>{if(state.stage>0){stop();state.stage--;render()}});
    $('next').addEventListener('click',()=>{if(state.stage<5){stop();state.stage++;state.visited=Math.max(state.visited,state.stage);render()}});
    $('shots').addEventListener('click',e=>{const b=e.target.closest('[data-frame]');if(b)selectFrame(Number(b.dataset.frame))});
    $('progress').addEventListener('input',e=>{stop();state.progress=Number(e.target.value)/1000;state.frame=Math.min(3,Math.floor(state.progress*4));renderPreview();renderSceneList()});
    $('play').addEventListener('click',()=>{if(state.playing){stop();return}if(state.progress>=1){state.progress=0;state.frame=0}state.playing=true;playStart=Date.now()-state.progress*state.duration*1000;timer=setInterval(tick,80);tick()});
    render();
  </script>
</body>
</html>
