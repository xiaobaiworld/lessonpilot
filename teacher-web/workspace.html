<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KnownMap 1A 连接诊断页：验证公网工作台与本机插件之间的消息通道。">
    <meta name="robots" content="noindex">
    <title>1A 连接诊断 · KnownMap</title>
    <link rel="icon" type="image/png" href="assets/knownmap-icon.png">
    <style>
      :root { --paper:#f4f0e6; --white:#fffdf8; --ink:#16251f; --muted:#52635b; --line:#cbd3cd; --brand:#1d5c43; --ok:#1d5c43; --bad:#8b4f3d; }
      * { box-sizing: border-box; }
      body { margin:0; padding:32px 20px 64px; background:var(--paper); color:var(--ink);
             font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
      main { width:min(880px,100%); margin:0 auto; }
      h1 { margin:0 0 8px; font-size:26px; letter-spacing:-.02em; }
      .stage-note { margin:0 0 28px; padding:14px 16px; border-left:3px solid var(--brand);
                    background:var(--white); color:var(--muted); font-size:14px; }
      h2 { margin:32px 0 12px; font-size:17px; }
      .env { display:grid; grid-template-columns:auto 1fr; gap:6px 16px; margin:0;
             padding:16px; border:1px solid var(--line); border-radius:10px; background:var(--white); font-size:14px; }
      .env dt { color:var(--muted); }
      .env dd { margin:0; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; word-break:break-all; }
      .actions { display:flex; flex-wrap:wrap; gap:10px; margin:0 0 20px; }
      button { min-height:44px; padding:0 18px; border:1px solid var(--line); border-radius:8px;
               background:var(--white); color:var(--ink); font:inherit; font-size:14px; font-weight:650; cursor:pointer; }
      button:hover { border-color:var(--brand); color:var(--brand); }
      button:disabled { opacity:.5; cursor:not-allowed; }
      #status { padding:14px 16px; border:1px solid var(--line); border-radius:10px; background:var(--white); font-size:14px; }
      #status[data-state="ok"] { border-color:var(--ok); }
      #status[data-state="bad"] { border-color:var(--bad); }
      .log { margin:12px 0 0; padding:14px 16px; border:1px solid var(--line); border-radius:10px;
             background:var(--white); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             font-size:13px; white-space:pre-wrap; word-break:break-all; max-height:340px; overflow:auto; }
    </style>
  </head>
  <body>
    <main>
      <p><img src="assets/knownmap-icon.png" alt="" width="42" height="42"><strong> KnownMap</strong></p>
      <h1>1A 连接诊断</h1>

      <p class="stage-note">
        本页只验证工作台页面与本机插件之间的消息通道是否按协议工作。
        课程编辑、字幕导入和时间线在 1B 的真实教师工作台提供，本页不是那个工作台。
        这里保存的是一门固定的测试课程，用于验证往返，不代表真实课程内容。
      </p>

      <h2>当前环境</h2>
      <dl class="env">
        <dt>origin</dt><dd id="env-origin"></dd>
        <dt>pathname</dt><dd id="env-pathname"></dd>
        <dt>白名单</dt><dd id="env-allowed"></dd>
      </dl>

      <h2>协议操作</h2>
      <div class="actions">
        <button id="btn-ping" type="button">PING</button>
        <button id="btn-get" type="button">读取当前课程</button>
        <button id="btn-save" type="button">保存测试课程</button>
        <button id="btn-preview" type="button">创建预览会话</button>
        <button id="btn-clear" type="button">清除当前课程</button>
      </div>

      <div id="status" role="status" aria-live="polite">尚未执行操作。</div>
      <pre id="log" class="log" aria-label="操作记录"></pre>
    </main>

    <!--
      冻结的工作台契约与本页一起放在 teacher-web/shared/。
    -->
    <script src="shared/bridge-protocol.js"></script>
    <script src="shared/course-contract.js"></script>
    <script src="workspace-bridge-client.js"></script>
    <script src="workspace-diagnostics.js"></script>
  </body>
</html>
