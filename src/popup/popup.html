<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KnownMap 课程助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header class="brand">
      <img src="../assets/icon-48.png" alt="">
      <div>
        <strong>KnownMap</strong>
        <span>课程助手</span>
      </div>
      <span class="role-badge">学生</span>
    </header>

    <section class="intro" aria-labelledby="student-title">
      <p class="eyebrow">学生入口</p>
      <h1 id="student-title">使用授权码，无需注册</h1>
      <p>输入老师发来的课程授权码，课程会保存到这台浏览器。</p>
    </section>

    <form id="access-form">
      <label for="access-code">课程授权码</label>
      <input id="access-code" name="access-code" autocomplete="off" spellcheck="false" maxlength="28" placeholder="KM-XXXXX-XXXXX-XXXXX-XXXXX" required>
      <button id="download-button" type="submit">领取课程</button>
    </form>
    <p id="status" class="status" role="status"></p>

    <section class="courses" aria-labelledby="courses-title">
      <div class="section-heading">
        <h2 id="courses-title">我的课程</h2>
        <span id="course-count">当前 0 门</span>
      </div>
      <p id="course-empty" class="empty">还没有课程，输入授权码后会显示在这里。</p>
      <article id="course-record" class="course-card" hidden>
        <span id="course-title" class="course-title"></span>
        <a id="course-url" class="course-url" target="_blank" rel="noopener"></a>
        <a id="open-course" class="primary-link" target="_blank" rel="noopener">打开课程视频</a>
      </article>
    </section>

    <section class="teacher-entry" aria-labelledby="teacher-title">
      <div>
        <p class="eyebrow">老师使用</p>
        <h2 id="teacher-title">创建和发布课程</h2>
      </div>
      <a href="http://localhost:4173/teacher-web/editor.html" target="_blank" rel="noopener">教师登录</a>
    </section>
  </main>
  <script src="../content/access-code/access-panel.js"></script>
  <script src="popup.js"></script>
</body>
</html>
